# Open WebUI do servidor de IA (ver WebUI.md). Segredos ficam em .env (nao versionado).
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    env_file: .env
    volumes:
      - ./data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
